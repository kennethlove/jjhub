# WHY: test fixtures shell out to `git commit`, and a developer's global
# signing config (commit.gpgsign + a locked 1Password signer) leaks into them
# and fails unrelated suites. Sign nothing from cargo-run processes; jj writes
# the repo's real commits and does not go through this.
[env]
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "commit.gpgsign"
GIT_CONFIG_VALUE_0 = "false"
GIT_CONFIG_KEY_1 = "tag.gpgsign"
GIT_CONFIG_VALUE_1 = "false"
