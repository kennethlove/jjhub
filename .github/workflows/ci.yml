# story: e02s01
name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  preflight:
    # WHY: 4 shards — 390 tests sum ~720s of CPU, so one job's 4
    # vCPU saturate around 198s regardless of runner speed. Shards
    # split the test CPU; the ~58s workspace rebuild per shard is
    # the accepted overhead.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: jjhub
          POSTGRES_DB: jjhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:jjhub@localhost:5432/jjhub_test
      # story: CI hygiene — jj-lib-heavy debug builds exhausted runner
      # disk (and once killed the linker with a bus error); no debuginfo
      # roughly halves target/ size.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # WHY: sqlx's compile-time migrator embeds the migration files
      # but does NOT track the directory as a rebuild input on stable,
      # so a cached binary silently ships the old schema — key the
      # cache on the migration files so any schema change forces a
      # fresh build.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mig-${{ hashFiles('crates/server/migrations/*.sql') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # WHY: cargo test runs one test binary at a time; the test step is
      # ~85% of preflight wall time (266s of the 314s warm baseline).
      # nextest runs binaries in parallel — 390 tests in 60s locally vs
      # 3m52s for cargo test. Pin follows the e2e job's jj pin style.
      # nextest does not run doctests; the workspace has none today.
      - name: Install nextest
        run: |
          V=0.9.151
          NAME=cargo-nextest-$V-x86_64-unknown-linux-gnu
          curl -fsSL -o /tmp/nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$V/$NAME.tar.gz"
          tar -xzf /tmp/nextest.tar.gz -C "$HOME/.cargo/bin" cargo-nextest
      - name: Tests
        env:
          # WHY: test-only opt-in (unset everywhere else, so
          # production and e2e keep RFC 9106 defaults). Hashing is
          # ~33% of test CPU and every hash is a unit test fixture.
          JJHUB_ARGON2_M_COST: "8"
        # WHY: nextest's built-in hash partitioning gives each shard a
        # stable, disjoint slice — no hand-rolled sharding.
        run: >
          cargo nextest run --workspace
          --partition hash:${{ matrix.shard }}/4

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: jjhub
          POSTGRES_DB: jjhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:jjhub@localhost:5432/jjhub_test
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # WHY: same as preflight — the embedded sqlx migrator is not
      # rebuild-tracked on stable; key on the migration files so the
      # server binary always embeds the current schema.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mig-${{ hashFiles('crates/server/migrations/*.sql') }}
      - name: Install jj
        run: |
          V=0.46.0
          NAME="jj-v$V-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/v$V/$NAME.tar.gz"
          sudo tar -xzf /tmp/jj.tar.gz -C /usr/local/bin ./jj
      # kata-server builds outside this repo, so it gets its own cache
      # slot keyed on the compose pin — the pin is the only input that
      # changes it
      # WHY: clone before the cache restore (BUG-001) — a cache hit
      # pre-creates the workspace dir and git clone refuses a non-empty
      # destination; the restore then extracts target/ over the checkout.
      - name: Clone kata sidecar at the compose-pinned commit
        run: |
          PIN='s/.*KATA_COMMIT: ${KATA_COMMIT:-\([0-9a-f]\{40\}\)}.*/\1/p'
          KATA_COMMIT=$(sed -n "$PIN" docker-compose.yml)
          git clone --quiet https://github.com/martint/kata.git \
            "$RUNNER_TEMP/kata"
          git -C "$RUNNER_TEMP/kata" checkout --quiet "$KATA_COMMIT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ runner.temp }}/kata"
          key: kata-${{ hashFiles('docker-compose.yml') }}
      - name: Build kata sidecar
        env:
          KATA_SKIP_WEB_BUILD: "1"
        run: |
          cargo build --quiet -p kata-server \
            --manifest-path "$RUNNER_TEMP/kata/Cargo.toml"
          echo "$RUNNER_TEMP/kata/target/debug" >> "$GITHUB_PATH"
      - name: E2E suite
        run: |
          for s in e2e-clone e2e-mr-open e2e-cascade-merge \
                   e2e-sidecar e2e-review-proxy \
                   e2e-ssh-push; do
            echo "== $s =="
            bash "scripts/$s.sh"
          done
