<!doctype html><html><head><link rel="stylesheet" href="/assets/app.css"></head><body>
<h1>{{ owner | safe }}/{{ name | safe }} — {{ change_id | safe }} ({{ mr_state | safe }})</h1>
{% if badges %}<p class="statuses">{{ badges | join(sep=" ") | safe }}</p>{% endif %}
{{ sections | join(sep="\n") | safe }}
<!-- story: e14s01 — inline kata embed; the Review link below stays as the no-frame fallback -->
{% if review_href %}<iframe src="{{ review_href | safe }}" title="Kata review for {{ change_id | safe }}" width="100%" height="800" loading="lazy"></iframe>{% endif %}
{% if review_href %}<p><a href="{{ review_href | safe }}">Review in kata &rarr;</a></p>{% endif %}
<form method="post" action="/{{ owner | safe }}/{{ name | safe }}/merge-requests/{{ change_id | safe }}/merge"><input type="hidden" name="_csrf" value="{{ csrf | safe }}"><button type="submit">Merge</button></form>
<form method="post" action="/{{ owner | safe }}/{{ name | safe }}/merge-requests/{{ change_id | safe }}/abandon"><input type="hidden" name="_csrf" value="{{ csrf | safe }}"><button type="submit">Abandon</button></form>
</body></html>
