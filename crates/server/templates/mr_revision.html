<section data-revision="{{ commit | safe }}"><h2>{{ commit | safe }}</h2><pre>{{ diff_html | safe }}</pre>{% if threads %}<ul class="threads">{% for t in threads %}<li>{{ t.handle_html | safe }}: {{ t.body_html | safe }}</li>{% endfor %}</ul>{% endif %}<form method="post" action="/{{ owner | safe }}/{{ name | safe }}/merge-requests/{{ change_id | safe }}/comments"><input type="hidden" name="revision" value="{{ commit | safe }}"><input type="hidden" name="_csrf" value="{{ csrf | safe }}"><input name="body" placeholder="Comment on this revision" required><button type="submit">Comment</button></form></section>
