[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true, features = ["json"] }
tokio.workspace = true
tower.workspace = true
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# WHY: object-safe async Mailer trait — async-trait is already in the lock graph
async-trait = "0.1"
http-body-util = "0.1"
sqlx = { workspace = true, features = ["migrate"] }
tera.workspace = true
argon2 = { workspace = true, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
# WHY: story e21s02 — gravatar derives md5(lowercase email); md-5 0.10
# is already in the dependency tree (transitive), so no new download.
md-5 = "0.10"
# WHY: story e17s01 upgraded 0.8 -> 0.10: ssh-key (via russh) needs the
# rand_core 0.10 CryptoRng for host-key generation; one rand in the tree.
rand = "0.10"
hex = "0.4"
serde.workspace = true
uuid.workspace = true
chrono.workspace = true
domain = { path = "../domain" }
jj-lib = "0.41"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
serde_json = "1"
# WHY: russh — story e17s01 needs an in-process SSH server; the stdlib
# has no SSH and OpenSSH sshd cannot consult the token table.
russh = "0.64.1"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tempfile = "3"
