# story: e02s01 — self-host: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jjhub
      POSTGRES_USER: jjhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjhub -d jjhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jjhub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jjhub
      # generate: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      JJHUB_STORAGE_ROOT: /var/lib/jjhub/repos
      # story: e05s03 — the app proxies /review/** to the sidecar
      KATA_UPSTREAM: http://kata:7878
      # story: kata links — browser-facing loopback URL
      KATA_PUBLIC_BASE: http://127.0.0.1:7878
    volumes:
      - repo-data:/var/lib/jjhub
    ports:
      - "3000:3000"

  # story: e05s02 — kata review sidecar. Built from upstream source at a
  # pinned commit (the published image rejects anonymous pulls). Serves the
  # review UI/API on 7878; the app proxies to it via /review (e05s03). The
  # sidecar scans /workspaces for jj workspaces, so it mounts the same
  # storage the app writes meta dirs into. No published host port — the app
  # is the only intended caller (e05s03 adds auth in front).
  kata:
    build:
      context: .
      dockerfile: Dockerfile.kata
      args:
        KATA_COMMIT: ${KATA_COMMIT:-9c7903dd458160a7b91eb1e43d2a35e11731ccf8}
    depends_on:
      db:
        condition: service_healthy
    environment:
      KATA_DATA: /var/lib/kata
      # story: e05s02 — kata's flag env is KATA_WORKSPACE (singular), value
      # form is "name=path"; the wildcard scans the flattened meta root.
      KATA_WORKSPACE: "*=/var/lib/jjhub/repos/.meta"
      # story: e05s03 — identity comes from the app proxy's X-Review-Author
      # header only. Trust is network-scoped: no host port is published, so
      # only containers on the compose network (the app) can reach kata.
      # 0.0.0.0/0 is safe ONLY because of that isolation — never publish
      # this service while it runs in trust-forwarded-header mode.
      KATA_AUTH_MODE: trust-forwarded-header
      KATA_AUTH_TRUSTED_HEADER: X-Review-Author
      KATA_AUTH_TRUST_UPSTREAM: 0.0.0.0/0
      KATA_AUTHOR: jjhub@localhost
      KATA_BIND: 0.0.0.0:7878
    volumes:
      - repo-data:/var/lib/jjhub
      - kata-data:/var/lib/kata
    command: ["serve", "--author", "jjhub@localhost"]
    ports:
      # story: kata links — the SPA routes on absolute paths, so browsers
      # must reach kata at its own origin. Loopback-only: never exposed
      # off this machine (the trust-forwarded-header model assumes the
      # app proxy is the only remote caller). Remote hosting waits on
      # martint/kata#9 (base-path support).
      - "127.0.0.1:7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/api/whoami >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  repo-data:
  kata-data:
