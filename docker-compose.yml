# story: e02s01 — self-host: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jjhub
      POSTGRES_USER: jjhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjhub -d jjhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jjhub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jjhub
      # generate: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      JJHUB_STORAGE_ROOT: /var/lib/jjhub/repos
    volumes:
      - repo-data:/var/lib/jjhub
    ports:
      - "3000:3000"

volumes:
  db-data:
  repo-data:
