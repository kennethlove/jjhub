# specs/product/SCOPE_LATEST.yaml — bounded PRD for jjhub v0.6.0
# v0.5.0 scope archived at specs/product/snapshots/SCOPE-v0.5.0-2026-11-03.yaml
version: "0.6.0"
feature_name: "jjhub"
core_value: >
  After v0.5.0 taught an operator to cut off an abuser's account,
  v0.6.0 gives the operator the rest of the public-node toolkit:
  take a repository down, keep bots out of signup, close the door
  on registration entirely, and read the moderation trail after
  the fact.
summary: >
  v0.5.0 shipped account suspension across every auth seam, but
  suspension alone leaves three public-node gaps and one
  usability gap. First, a suspended abuser's public repositories
  stay readable and a non-registered viewer still sees them — an
  operator needs a reversible way to take a repository down
  without deleting anyone's work. Second, registration is open
  and costless beyond rate budgets; a CAPTCHA on signup raises
  the cost of mass account creation to a real one. Third, an
  operator who wants the node quiet can stop the inflow entirely
  by closing registration, with existing accounts untouched.
  Fourth, the moderation_actions rows e29 writes cannot be
  reviewed — the audit trail exists but nobody can read it, so
  v0.6.0 adds an export the operator can actually use. All four
  build on the operator surface and audit table v0.5.0 already
  established; nothing here adds a new auth path or a new
  service tier.
in_scope:
  - id: e30
    title: "Repo takedown — reversible operator action on repository content"
    detail: >
      An operator can take a repository down from the web UI: the
      repo stops serving browse, smart HTTP, and SSH to everyone
      except the operator and the repository's owner, while the
      underlying history is preserved untouched. The operator can
      restore it the same way, and every takedown and restore is
      recorded in moderation_actions like suspend and unsuspend.
      This is visibility, not deletion — no history is rewritten,
      no rows are dropped.
    why: >
      Suspension cuts off the person; takedown cuts off the
      content. A public node needs a reversible lever for
      doxxed or illegal material where the account action is
      either too late (the content already spread from an
      unsuspended account) or too blunt (suspending an account
      whose repo a third party relies on).
  - id: e31
    title: "CAPTCHA on signup"
    detail: >
      New-account registration presents a CAPTCHA challenge; a
      solved proof-of-human is required before the account row is
      created. Login, password reset, and every existing flow are
      untouched. The check fails closed when the verifier is
      unreachable only in the sense that signup is refused with a
      clear retry message — never silently skipped.
    why: >
      Rate budgets (e20) bound the cost of abuse per IP but a
      distributed signup burst still buys accounts cheaply.
      CAPTCHA makes each account cost human attention, which is
      the one currency botnets cannot budget for.
  - id: e32
    title: "Closing registration"
    detail: >
      An operator can close registration from the web UI: the
      signup surface refuses new accounts with a clear message,
      existing accounts and sessions are untouched, and the
      operator can reopen the door the same way. The setting is
      one row, the state change is recorded in moderation_actions,
      and it survives restarts because it is not an env var.
    why: >
      The cheapest moderation a public node can offer is stopping
      the inflow — for a private party, a conference, or a node
      under signup flood. Reversible and operator-gated, same as
      every other lever in this cycle.
  - id: e33
    title: "Moderation audit export"
    detail: >
      The operator can read and export moderation_actions from
      the web UI: a filterable list (actor, target, action, time)
      on the admin surface and a CSV download of the same rows.
      Ordinary users never see the surface; the export covers the
      full retention of the table, not a rolling window.
    why: >
      e29 writes an audit trail nobody can read. A trail exists
      for review after the fact — incident write-ups, disputes,
      "when did I do that" — and a table with no reader is a
      write-only promise.
out_of_scope:
  - item: "Multi-tier roles (moderator / admin / superadmin)"
    why: >
      User decision: can wait. One operator role still covers the
      single-node deployment this product targets.
  - item: "Appeals, suspension notification mail, any out-of-band messaging"
    why: >
      Needs mail infrastructure first; requirements are drafted
      separately and land with the epic that adopts them, not
      implicitly here.
  - item: "Per-owner block lists"
    why: >
      Carried deferral from v0.5.0: one suspension still covers
      every authenticated surface; a per-target list earns its
      complexity only when a harassment report shows suspension is
      too blunt.
  - item: "IP bans beyond the e20 rate budget"
    why: >
      Carried deferral: banning IPs punishes shared NATs and is
      trivially evaded — wrong lever, rate budgets stay the brake.
  - item: "Content deletion, history rewriting, or forced visibility change"
    why: >
      Destructive and irreversible on someone else's work. Takedown
      (e30) is the reversible 80%; actual deletion needs a
      due-process design jjhub does not have.
  - item: "Hiding or delisting the node itself"
    why: >
      Product inversion — the node stays public; closing
      registration (e32) stops the inflow without hiding what is
      already there.
constraints:
  - "Rust / axum / htmx / Tera / Tailwind, sqlx + Postgres — unchanged"
  - >
    Enforcement lives where identity is already checked (session,
    token authenticate/authorize, transport admission); no
    parallel auth path is added
  - >
    CAPTCHA implies one outbound verifier call at signup — the
    only external dependency this cycle, selected and verified by
    research-first before any code
  - >
    Every operator action is reversible and recorded in
    moderation_actions (the v0.5.0 rule, still load-bearing)
success_criteria: >
  From the admin surface an operator takes a public repository
  down: an anonymous visitor and a normal account both get a
  refusal on browse, smart HTTP, and SSH, while the owner and the
  operator still see it — and a restore returns it for everyone,
  proven by automated tests. A signup with an unsolved CAPTCHA
  creates no account row, and a solved one does. Closing
  registration refuses a new signup with a clear message while
  existing sessions keep working, and reopening clears it. The
  operator exports moderation_actions as CSV containing the
  suspend, unsuspend, takedown, restore, and close/reopen rows
  with actor, target, and time. Every state change is one row in
  moderation_actions, and a non-operator can reach none of these
  surfaces (404/403, tested).
references:
