# v0.8.0 scope — generated by scope-work on 2026-11-06
version: "0.8.0"
bump_hint: minor
core_value: >
  jjhub proves its mail actually delivers — a staging send with a
  recorded outcome and a clear retry when the send path fails — so a
  live relay can be configured later behind evidence instead of hope.
summary: >
  Builds the v0.7.0 phase gate: per-send delivery outcomes recorded
  in the mail log, an operator-facing readout on /admin, and a clear
  retry on the signup/resend path when the send fails. Reset stays
  response-neutral by design. The staging proof (configure a relay,
  show the recorded outcomes) is the readiness evidence that unlocks
  live configuration in a later release.
in_scope:
  - >
    Epic e36 — delivery readout: every mail_log line records the
    send's outcome (ok/failed with reason) at the single write point,
    /admin gains a compact recent-deliveries readout, the phase-gate
    condition "delivery readout" is satisfied, and a test with
    injected send failures proves the lines record both outcomes.
  - >
    Epic e36 — signup/resend clear retry: when the send path fails
    on signup or resend, the page shows a clear retry and never a
    500 (reset already stays response-neutral by contract — kept
    neutral, not reopened); a failing send still leaves no
    half-account.
  - >
    Epic e36 — staging proof: operator instructions (relay creds
    via the existing SMTP env family) plus the recorded-outcome
    evidence from a staging send, so live configuration ships later
    only after the gate passes; a success criterion asserts the
    proof procedure exists and the readout reports it.
out_of_scope:
  - >
    Choosing or enabling a live SMTP default: configuration stays
    operator-provided after the gate and is decided in the release
    that ships it (deferred — phase gate).
  - >
    Queueing, retries, bounce/complaint handling, suppression
    lists: delivery stays best-effort single-send until a drain
    story exists (deferred — needs an operator surface for the
    list).
  - >
    Log-service drains: no JJHUB_LOG_DRAIN code — env stays unset
    means file only, and the single write point is the readiness
    hook (deferred — waiting on a chosen service).
  - >
    HTTP-API provider profiles (SendGrid/Mailgun/SES-style
    declarative profiles): SMTP covers relay APIs; add only on
    real demand (deferred — YAGNI).
  - >
    Multi-tier roles, appeals, notification preference center,
    newsletters/digests, inbound mail, password-reset CAPTCHA,
    per-owner blocklists, IP bans: carried from v0.7.0.
constraints:
  - >
    Stack unchanged: Rust / axum / Tera / Tailwind; mail keeps the
    v0.7.0 two-layer shape (message kinds over one transport,
    LogMailer default, lettre SMTP arm behind explicit env).
  - >
    Phase gate: no live SMTP default ships until a staging send
    with a delivery readout passes; the readout must be a fact on
    the operator's screen, not a log line.
  - >
    Every operator action still notifies the affected user (no
    secret actions); reset stays response-neutral even when the
    send fails.
  - >
    No secrets in logs: outcome lines carry structured fields only
    (recipient, result, reason) — never message bodies, tokens, or
    provider credentials.
success_criteria:
  - >
    Staging relay configured by env (SMTP) sends one verification
    email and the /admin readout shows the outcome — the
    phase-gate condition from MAIL-LATEST.md passes.
  - >
    A failed send produces a clear retry on signup/resend, never a
    500, and its mail_log line records the failure outcome.
  - >
    The retention log is the single write point for outcomes —
    exactly one line per send with ts, to, subject, and result.
  - >
    Existing suites stay green: mail_core, reset_mail,
    mail_notices, jsonl_retention, operator_moderation,
    repo_takedown (behavior unchanged for working mail).
references:
  - "specs/requirements/MAIL-LATEST.md"
  - "specs/product/snapshots/SCOPE-v0.6.0-2026-11-05.yaml"
  - "specs/product/snapshots/SCOPE-v0.7.0-2026-11-05.yaml"
