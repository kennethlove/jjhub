# v0.7.0 scope — generated by scope-work on 2026-11-05
version: "0.7.0"
bump_hint: minor
core_value: >
  jjhub tells users what happened. Every account-lifecycle and
  moderation event that touches a person reaches that person by
  email, from one protocol-generic transport, with no secret ever
  reaching a log line.
summary: >
  Mail operations: address-verification and password-reset links
  plus operator notices (suspension, takedown, restore), built as
  typed messages over one SMTP-primary transport with a dev/test
  stub arms, gated so nothing sends live until confirmation links
  and a delivery readout are proven in staging. Built on the
  requirements in specs/requirements/MAIL-LATEST.md.
in_scope:
  - >
    e34 mail core — two-layer mailer (typed messages over one
    transport), LogMailer default when unset, SMTP as the primary
    prod path via JJHUB_EMAIL_PROVIDER=smtp + the JJHUB_SMTP_*
    env family, existing resend/messagepit arms kept, message kinds
    for address verification (resend + 60s cooldown), password reset
    (single-use 1h token, neutral response), and the four moderation
    notices with the operator's reason verbatim; every operator
    action that touches a user emails that user
  - >
    e34 mail logging and phase gates — stdout JSONL with values in
    structural fields (fingerprint/sha256, never raw tokens,
    credentials, or auth headers), 90-day default retention, and
    hard phase gates: no live send until confirmation links and a
    delivery readout pass in staging
  - >
    e35 mail retention — retention window and drain hooks for a
    future log service rolled with this cycle (release-plan note),
    still JSONL-on-stdout first
out_of_scope:
  - "Multi-tier roles — user decision: can wait"
  - >
    Inbound mail, attachments, tracking pixels, notification
    preferences, appeals automation — notices link to a reply path
    only
  - "Per-owner block lists and IP bans beyond the e20 rate budget"
  - >
    HTTP-API provider adapters — deferred until a real API-only
    provider appears (one declarative profile, not a coded arm)
  - "Login and password-reset CAPTCHA (signup only, shipped v0.6.0)"
constraints:
  - "Rust / axum / htmx / Tera / Tailwind, sqlx + Postgres — unchanged"
  - >
    SMTP client is one research-first crate decision, never
    hand-rolled sockets; justification recorded before adoption
  - >
    Phase gate: no live send path exists until the confirmation
    flow passes in staging; dev defaults stay LogMailer
  - >
    Secrets live in one env family and never appear in a log line;
    redaction follows the e28 copy-button lesson (values in fields,
    fingerprints for secrets)
success_criteria:
  - >
    With mail configured, signup sends a verification link; opening
    it verifies the address and unblocks login; unconfigured dev
    nodes keep today's flow byte-for-byte
  - >
    Password-reset requests always answer neutrally, and a valid
    link sets a new password exactly once before expiring
  - >
    Suspending, unsuspending, taking a repo down, and restoring it
    each deliver a notice to the affected user when mail is
    configured, with the operator's reason verbatim
  - >
    Grep the logs for any live token or secret: zero hits; every
    message kind logs a structural fingerprint instead
  - >
    Phase gate honored: no live send exists until confirmation and
    delivery readout pass staging
references:
  - "specs/requirements/MAIL-LATEST.md"
  - "specs/product/snapshots/SCOPE-v0.6.0-2026-11-05.yaml"
  - "specs/release-plan.yaml (v0.7.0 index lands with plan-release)"
