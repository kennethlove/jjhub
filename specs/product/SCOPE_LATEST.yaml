# v0.9.0 scope — generated by scope-work on 2026-11-07
# Cycle: product-home — the logged-out landing becomes a product page
# for self-hosters. User decisions recorded in session (replace `/`,
# agent drafts copy for review, footer /login only).
version: "0.9.0"
bump_hint: minor
core_value: >
  jjhub's logged-out home page sells self-hosting to operators
  evaluating the forge — what it is, what shipped, how to run it —
  with zero account or signup friction on the page; and the kata
  review UI it links into wears the same design system instead of
  a foreign chrome.
summary: >
  Redo the logged-out `/` landing as a single product page aimed at
  self-hosters: the audience VISION_LATEST names as the MVP target.
  The current landing pitches the jj workflow to developers; the
  new page keeps that identity but leads with what an operator
  cares about — running jjhub yourself, what ships with it (mail
  that delivers, moderation, rate limits, delivery readout), and
  where the deploy instructions live. Sections are drafted by the
  agent from shipped facts (CHANGELOG v0.8.0, README, DESIGN.md)
  and reviewed by the user before any code is written. Auth stays
  reachable only as a quiet footer link to /login for the operator
  who already runs an instance; the page carries no signup, no
  push, and no account CTAs of any kind. The logged-in dashboard
  branch of the home route is untouched.
  Second initiative of the cycle: the kata sidecar is proxied at
  jjhub's origin but ships its own chrome, so review links drop
  visitors into a visually foreign app. A proxy-injected theme
  stylesheet, built from DESIGN.md tokens, restyles the pinned
  bundle without forking it (user decision: no upstream PRs; fork
  only if a source change proves necessary later).
in_scope:
  - >
    Epic e38s01 — product home: the logged-out `/` response renders
    the self-hoster product page in place of the current landing
    section (the logged-in dashboard branch stays as it is).
  - >
    Epic e38s01 — drafted copy: agent writes the page sections from
    shipped facts only (CHANGELOG v0.8.0, README, DESIGN.md, VISION);
    the draft goes to the user for review and approval BEFORE any
    implementation work (user decision, session 2026-11-07).
  - >
    Epic e38s02 — auth surface: footer carries exactly one quiet
    link to /login; the page contains zero signup, register, push,
    or account-creation CTAs (user decision, session 2026-11-07).
  - >
    Epic e38s03 — verification: ux_audit strict passes on the
    page's stylesheet, no horizontal scroll at 390px, and the
    full preflight (fmt, clippy -D warnings, tests, build) stays
    green with home-page suites updated to the new content.
  - >
    Epic e39s01 — kata theme injection: the pinned sidecar
    bundle's theming surface is inventoried (CSS variables and
    key selectors) and recorded, the proxied HTML responses gain
    an injected theme stylesheet link at jjhub's origin, and a
    kata-theme stylesheet derived from DESIGN.md tokens restyles
    the review UI — API and asset pass-through stay
    byte-identical.
  - >
    Epic e39s02 — theme verification: ux_audit strict passes on
    the theme stylesheet, a capture of the themed review page
    shows the jjhub palette and type, and preflight stays green.
out_of_scope:
  - >
    A separate /product route: user chose to replace the logged-out
    `/` home instead (one page, one route — deferred alternative).
  - >
    Static HTML outside the Tera app: the page lives in the
    existing template system (chosen in the same session — not
    valuable enough to fork the render path).
  - >
    Multi-page marketing site, docs site, or blog: "it can be just
    a page" — one screen first; more pages only on real demand
    (deferred — YAGNI).
  - >
    Signup, register, or push CTAs anywhere on the product page:
    explicit user directive — the page must have nothing related
    to accounts (user decision, session 2026-11-07).
  - >
    Changes to /login, /register, nav auth affordances, or the
    logged-in dashboard: auth surfaces outside the product page
    keep working exactly as today (not valuable — scope is the
    landing only).
  - >
    Copy beyond shipped facts: no invented claims, benchmarks, or
    roadmap promises; the review gate is against CHANGELOG/README/
    DESIGN (not valuable — trust; a wrong claim on a product page
    costs more than it sells).
  - >
    New backend features, APIs, or page data: the product page is
    presentational — nothing new to query or mutate (not valuable —
    YAGNI).
  - >
    Upstream PRs to martint/kata: user decision — no upstream
    contribution path; if a source change ever proves necessary,
    fork the repo and pin the fork instead (deferred — injection
    covers this cycle's need).
  - >
    Header injection (option 2) and the iframe shell (option 3):
    escalations to decide AFTER the theme layer lands (user
    decision, session 2026-11-07).
  - >
    Forking kata or changing its source in this cycle: the theme
    rides entirely on the proxy seam and a stylesheet — no fork
    exists yet (deferred — not needed until overrides prove
    insufficient).
constraints:
  - >
    Stack unchanged: Rust / axum / Tera / Tailwind; the page is
    built from DESIGN.md's token system only (no new CSS system,
    no off-system values).
  - >
    UX discipline strict: tokens only, named elevations, full
    interaction states, one accent — ux_audit is the blocking gate
    before handoff; a failed audit keeps the page in draft.
  - >
    Agent drafts copy first, user approves the draft before code
    (workflow order fixed by user decision, session 2026-11-07).
  - >
    No account CTAs on the product page — footer /login link is
    the only auth affordance that ships.
  - >
    kata theme rides the existing proxy seam only: DESIGN.md
    tokens for every value, no source changes to the pinned
    bundle, no fork in this cycle; the pin is the DOM-stability
    assumption — a bump re-runs the selector inventory.
success_criteria:
  - >
    A logged-out GET `/` returns the product page: self-host pitch,
    shipped-features sections, deploy pointer — and contains no
    signup, register, or push CTA anywhere, with a footer link to
    /login present.
  - >
    The user has reviewed and approved the drafted copy before
    implementation begins (approval recorded in session).
  - >
    ux_audit strict passes on the page's stylesheet; the page has
    no horizontal scroll at 390px.
  - >
    Preflight green: fmt, clippy -D warnings, full test suite,
    build — with home-page suites asserting the new content
    passing.
  - >
    A proxied review-page HTML response carries the theme
    stylesheet link, API and asset responses stay byte-identical,
    and a capture of the themed page shows jjhub's palette and
    type with ux_audit passing on the theme stylesheet.
