# specs/product/SCOPE_LATEST.yaml — bounded PRD for jjhub v0.4.0
# v0.3.0 scope archived at specs/product/snapshots/SCOPE-v0.3.0-2026-10-25.yaml
version: "0.4.0"
feature_name: "jjhub"
core_value: >
  Adding a remote and pushing is enough to start a project — a push
  to an owned path creates the repo on the fly — expensive actions
  (push, repo create, token create, login) are budgeted per user and
  per IP so one client cannot spin the server, and every account
  starts with the transport token it needs, rotatable when in doubt.
summary: >
  v0.4.0 closes the first-push gap and puts a brake on the expensive
  endpoints. Today a push to a repo path that does not exist is a
  404, so the natural jj/git workflow (add remote, push) dies at the
  web form; jjhub now creates the repo when a token-holder pushes to
  a nonexistent path they own — same prior art as Gitea/Codeberg,
  GitLab, and soft-serve — over smart HTTP and SSH alike, through
  ONE shared creation service so the UI form and both transports
  cannot drift. Second, nothing throttles pushing, repo creation,
  token creation, or login; an in-process token bucket now budgets
  those actions per user and per IP, returns 429 with Retry-After on
  HTTP, and disconnects cleanly on SSH. The limiter is opt-in via
  env and structurally absent in tests, so the existing suite stays
  green. Third, the token lifecycle gets honest defaults: signup
  mints a transport token (plaintext shown once on the post-signup
  details screen), regenerate rotates it, and the repo-page minting
  form is demoted to an advanced affordance so the default path is
  account-level and post-signup delivery is one details screen.
  Fourth, every token now carries explicit permissions —
  read/write scopes, optional expiry, optional repo pin, optional
  IP allowlist — enforced at authentication and authorization on
  both transports.
  Deployment reality is one Coolify container: no new crate,
  no distributed state, single-node honest.
in_scope:
  - id: e19
    title: "Push-to-create — first push creates the owned repo"
    detail: >
      A receive-pack push to a nonexistent repo path creates the repo
      when the URL owner segment equals the pushing token user's
      handle: shared creation service (validate, dup-check,
      init_bare, jj_meta init, INSERT tx with fs cleanup on failure,
      unique-constraint re-lookup), row inserted before git
      http-backend spawns so admission and hooks see it, PRIVATE by
      default (e10s02 settings UI flips later), SSH parity through
      the same helper. upload-pack on a missing repo and pushes into
      another user's namespace stay 404.
    why: >
      The natural jj/git workflow is "add remote, push"; every
      create-on-push forge supports it and jjhub currently dead-ends
      at a web form. Ownership-gated + PRIVATE means no squatting
      surface and no public-namespace probing.
  - id: e20
    title: "Rate limiting — per-user and per-IP budgets"
    detail: >
      An in-process token budget (no new crate) wraps exactly the
      expensive actions — git push over smart HTTP and SSH, repo
      creation (UI POST /repos and push-to-create), token creation
      (/settings/tokens and the repo-page token route), and login
      POST — with per-user and per-IP dimensions, env-configurable
      budgets and burst, HTTP 429 + Retry-After, and a clean SSH
      disconnect before any git process spawns. Disabled via env and
      absent from test constructors.
    why: >
      Rate limiting is a named priority defensive category in
      CONVENTIONS; a self-hosted forge's push path spawns git
      subprocesses and writes stores, so an unthrottled client is a
      denial-of-service lever. Per-IP covers anonymous abuse
      (login), per-user covers authenticated load.
  - id: e21
    title: "Token model — signup token, regenerate, demoted minting"
    detail: >
      Signup automatically issues one transport token (stored
      hashed, e15s02 shown-once discipline): after signup the user
      lands on a one-time details screen where the plaintext is
      copy-once, completion is marked, and the screen never
      re-renders (abandoned and existing users never see it). The
      screen also carries three preferences: display name (new
      users column, nullable, falls back to handle), theme
      preference dark/light/system (new users column, default
      system), and the account gravatar computed from email with a
      link to gravatar.com to change it (derived, no column).
      A regenerate action rotates the token — revoke old, issue new,
      plaintext shown once on settings — and counts as token
      creation for rate-limit purposes. The repo-page token form is
      demoted behind an explicit advanced disclosure (route and
      tests stay); the default minting path is account-level.
      Existing zero-token users are not backfilled.
    why: >
      A user who just signed up cannot clone their own empty repo
      until they hunt down the settings page, and the repo-page form
      makes per-repo minting look like the default. Auto-issue plus
      rotate matches what every forge user expects from "my token",
      and demoting the repo form keeps per-repo tokens possible
      without advertising them.
  - id: e22
    title: "Token permissions — scopes, expiry, pinning, IP allowlist"
    detail: >
      Transport tokens gain explicit permissions instead of flat
      identity: a scope set per token (read for clone/fetch, write
      for push), optional expiry, optional pin to one repository,
      and an optional CIDR allowlist. authenticate() loads the
      restrictions and rejects expired, foreign-repo, or wrong-IP
      tokens before authorize runs; authorize maps upload-pack to
      read and receive-pack to write inside the admission decision
      both transports already share. Existing tokens migrate to
      the full scope set, so no current workflow changes. Signup
      and regenerate default to read+write; settings forms select
      scopes, expiry, and pin; the demoted repo-page form
      pre-pins its repo.
    why: >
      A transport token is today's only non-interactive credential
      and it carries full push identity forever. A leaked
      read-only or repo-pinned token is a bounded problem, an
      expired one stops itself, and an allowlisted one dies
      off-box. User decision 2026-10-25: this is v0.4.0 scope,
      not a later cycle.
out_of_scope:
  - item: "Issues tracker, orgs/teams, OIDC, CI runners, full-text search"
    why: "Deferred since v0.1.0/v0.2.0 — unchanged reasons on record"
  - item: "Rate limiting every route / per-route fine-tuning"
    why: >
      The policy table is explicit; extending it later is one row
      plus one wrap. Blanket throttling of reads is a different
      product decision.
  - item: "Distributed rate-limit state (Redis or DB-backed counters)"
    why: >
      Deployment is one Coolify container; counters live in process.
      Revisit only when a second node exists.
  - item: "Login lockout, CAPTCHA, progressive backoff"
    why: >
      Brute force gets a plain per-IP budget; account-lock policy is
      a separate feature with recovery UX.
  - item: "Per-user repo-count quotas or plan-style limits"
    why: >
      Push-to-create admission is ownership + name validity only;
      quotas invent a billing model jjhub does not have.
  - item: "Changing UI create semantics (visibility, 409, 422)"
    why: >
      The shared service preserves existing behavior; a redesign of
      the create form is not this cycle.
  - item: "Removing the repo-page token route entirely"
    why: >
      Demoted behind an advanced affordance instead — one template
      change, existing consumers and tests unaffected.
  - item: "Email or out-of-band token delivery"
    why: "No mail infrastructure; plaintext is shown in-band, once."
  - item: "Backfilling tokens for existing zero-token users"
    why: >
      Only new signups auto-receive one; minting credentials for
      dormant accounts widens the attack surface for no workflow
      gain.
  - item: "OAuth/OIDC federation and PAT hierarchies"
    why: >
      Scopes land as native token permissions (e22); federation is
      a separate feature with a different threat model.
  - item: "Auto-PUBLIC on push-to-create or visibility flags in the push URL"
    why: >
      Conservative default is PRIVATE; flipping visibility is the
      e10s02 settings UI's job, after creation.
constraints:
  - "Rust / axum / htmx / Tera / Tailwind, sqlx + Postgres — unchanged"
  - >
    No new crate dependency for either epic: the limiter is a
    hand-rolled token bucket on axum middleware; push-to-create is
    service extraction plus a missing-row branch
  - >
    Rate limiting off unless the production constructor builds it
    from env; the 80+ existing tests must not start failing
  - >
    One creation path: UI create and push-to-create call the same
    service; transport admission stays shared between HTTP and SSH
  - "Public open source codebase; no external paid services"
  - "Conventional Commits; TDD where possible; specs/ as planning SoT"
  - "Preflight and CI stay green before forward work"
  - "Every story carries at least one story: eNNsNN tag in code/tests"
  - "Page HTML lives in Tera templates; routes.rs holds handlers only"
  - >
    UI work runs keystone render gates, impeccable live tools, and
    the ux audit before handoff
success_criteria: >
  A token-holder pushes to a nonexistent path under their own handle
  over smart HTTP and gets a repo: the repositories row exists, both
  stores are initialized, and the pushed refs are visible; an e2e
  test proves the whole path. The same push over SSH creates the
  repo identically. A push to someone else's nonexistent handle, an
  invalid name, or an upload-pack on a missing repo each return 404
  with no row created. `grep -rn "create_repo" crates/server/src |
  wc -l` shows one service used by UI and both transports, not three
  copies. With the limiter at a budget of 1, the second push returns
  HTTP 429 carrying a Retry-After header, and the SSH variant
  disconnects before spawning git. A new signup arrives with one
  transport token whose plaintext is shown exactly once (a one-time
  details screen after signup — display name, dark/light/system
  theme, email gravatar — gone once completed), regenerate revokes
  the old
  token and shows the new plaintext once, and the repo-page token
  form sits behind an explicit advanced disclosure. A read-only
  token clones but its push is refused, an expired token is
  rejected at authentication, a repo-pinned token works only on
  that repo, and an off-list IP is refused — identical behavior
  over HTTP and SSH. `cargo test`
  runs green with the limiter absent from test constructors.
  `cargo clippy --workspace
  --all-targets -- -D warnings` and `cargo fmt --all -- --check`
  pass.
references:
  - "specs/planning-context.yaml — key decisions for e19/e20/e21/e22"
  - >
    specs/product/VISION_LATEST.yaml — items 8 (divergence) and 9
    (git compat layer)
  - "specs/adr/0001-change-id-anchored-mr.md"
  - "CONVENTIONS.md — Defensive Code: rate limit is a priority"

# Prior Art — research-first (2026-10-25)
prior_art:
  adopt:
    - >
      Create-on-push admission shape from Gitea/Codeberg, GitLab,
      soft-serve: receive-pack on a missing owned path creates the
      repo; upload-pack on missing stays 404; GitHub deliberately
      does not do this.
    - >
      Token-bucket rate limiting as in-process state keyed
      (action, dimension, key) — the standard single-node shape
      (governor's algorithm, hand-rolled at this size).
  extend:
    - >
      routes::create_repo's creation sequence (validate, dup-check,
      init_bare, jj_meta init, INSERT tx, fs cleanup) extracted into
      a shared service instead of rewritten.
    - >
      transport::authorize's "one admission decision for both
      transports" principle, extended to creation admission.
  rejected:
    - >
      governor crate — new dependency; its distributed/ShardedBucket
      machinery is dead weight for one container (WHY: rule).
    - >
      tower-http RateLimit layer — one global bucket per key string,
      not per-user AND per-IP keyed budgets.
    - >
      Redis or Postgres-backed counters — write amplification on the
      hot push path with no second node to justify it.
    - >
      Reusing the UI create handler for push-to-create — transport
      has no session/CSRF/form; a shared service is the seam.
