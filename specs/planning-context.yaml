# specs/planning-context.yaml — written by elaborate-spec; consumed by scope-work and slice-tasks
feature_name: "jjhub v0.3.0 — divergence visible, SSH transport"
problem_statement: >
  v0.2.0 shipped conflict tolerance, audit, immutability, search, and
  the presentation pass. Two vision items remain unshipped and the user
  selected both for v0.3.0: divergence is invisible (a change-id with
  two non-ancestor heads renders as if nothing is wrong, while review
  identity is the product's core claim), and transport is HTTP-only
  (SSH is the default remote URL for most jj/git users). v0.3.0 makes
  divergence visible on the MR and repo surfaces, and serves
  git-over-SSH from a built-in listener authenticated by the existing
  transport tokens.
constraints:
  - >
    No new storage format — divergence is computed from the pushed
    graph + .meta, SSH state is config + host keys on disk
  - >
    Stack unchanged: Rust / axum / htmx / Tera / Tailwind / Postgres;
    Postgres via sqlx
  - >
    russh is the one new dependency (SSH server; tokio-native,
    Apache-2.0) — HTTP path untouched
  - "Page HTML lives in Tera templates; handlers stay in Rust"
  - "Preflight green and all existing tests keep passing"
  - "UI work runs keystone render, impeccable live, and ux audit before handoff"
  - "Conventional Commits; TDD; specs/ as planning source of truth"
out_of_scope:
  - >
    Issue tracker, orgs/teams, OIDC, CI runners, full-text search
    (carried forward)
  - >
    SSH via the host's sshd / authorized_keys forced commands (user
    chose built-in listener)
  - "SSH shell, SCP, or SFTP subsystems — git pack protocol only"
  - >
    Port 22 binding (dedicated configurable port; operator's reverse
    proxy owns 22 if desired)
key_decisions:
  - decision: "e16 divergence visible — compute, don't store"
    rationale: >
      jj divergence = same change-id, heads where neither contains the
      other. The server already reads change-ids (e11) and the op log
      (e09); evaluate divergence at render/push time, no schema change.
  - decision: "e16 surfaces — MR detail, MR list, repo page"
    rationale: >
      User choice at scope interview: MR + repo surfaces (not
      push-time-only, not audit-log). Review identity is where
      divergence misleads.
  - decision: "e17 SSH — built-in russh listener, token auth, exec git"
    rationale: >
      User choice: built-in sshd on configurable port (default 2202),
      host keys generated at first boot, transport token as password,
      shell out to git-upload-pack/git-receive-pack — same binaries the
      HTTP path already trusts. russh 0.64.1 (2026-10) tokio-native.
  - decision: "e17 ordering after e16"
    rationale: >
      Divergence is self-contained and ships first; SSH touches
      transport config and the repo-page snippets e16 also edits.
