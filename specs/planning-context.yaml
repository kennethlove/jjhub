# specs/planning-context.yaml — elaborate-spec output; consumed by scope-work
# v0.5.0 shipped (operator moderation, PR #80). Refreshed for the
# v0.6.0 scope-work pass below; elaborate-spec will overwrite this
# when the cycle's spec is written.
feature_name: "jjhub v0.6.0 — moderation follow-through"
problem_statement: >
  v0.5.0 taught jjhub to cut off an abuser's account, but four gaps
  remain for a public node. An operator can suspend a person yet
  cannot take down a repository's content. Registration is open and
  CAPTCHA-free, so rate budgets are the only brake on mass signup.
  And the moderation_actions rows written by e29 cannot be reviewed
  after the fact — the operator has an audit trail nobody can read.
constraints:
  - "Rust / axum / htmx / Tera / Tailwind, sqlx + Postgres — unchanged"
  - "Enforcement lives where identity is already checked; no parallel auth path"
  - >
    Destructive actions must be reversible or audited (v0.5.0 rule,
    still load-bearing)
out_of_scope:
  - "Multi-tier roles — user decision: can wait"
  - >
    Appeals and notification mail — needs mail infra first
    (requirements drafted separately)
  - >
    Per-owner block lists and IP bans beyond the e20 rate budget
    (v0.5.0 deferrals, unchanged)
