# specs/planning-context.yaml — elaborate-spec output; consumed by scope-work
# and slice-tasks. Refreshed for the v0.9.0 product-home cycle
# (2026-11-07); elaborate-spec will overwrite this when the next
# cycle's spec is written.
feature_name: "jjhub v0.9.0 — product home"
problem_statement: >
  The logged-out `/` landing pitches the jj workflow to developers,
  but the MVP audience is solo self-hosters evaluating whether to
  run jjhub themselves. They need to see what the product is, what
  already ships (mail that delivers, moderation, rate limits,
  delivery readout), and where the deploy instructions live —
  without any account or signup friction on the page.
constraints:
  - "Rust / axum / htmx / Tera / Tailwind — unchanged"
  - "DESIGN.md token system only; ux_audit strict is the blocking gate"
  - "Agent drafts copy from shipped facts; user reviews before code"
  - "Footer /login link is the only auth affordance on the page"
out_of_scope:
  - "Separate /product route, static HTML, multi-page marketing site"
  - "Signup/register/push CTAs on the product page"
  - "Changes to /login, /register, nav auth, logged-in dashboard"
  - "Copy beyond shipped facts; new backend features or page data"
