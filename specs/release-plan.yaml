# specs/release-plan.yaml — WSJF-ordered epic index for jjhub

# v0.9.0 cycle. version is a non-authoritative mirror; semantic-release
# decides the real tag at merge (gh release view wins).
# v0.8.0 epics (e34-e37) shipped; their capsules remain in specs/epics/.

version: "0.9.0"
status: planning
workflow_mode: solo-git
bump_hint: minor

# WSJF = (business value + time criticality + risk reduction) / job
# size; job size in day-equivalents (4 BCP ~= 1 focused day), the
# same scale as the prior cycles' entries. No security boost applied
# (no THREAT_MODEL files exist for these epics). Requirements source:
# specs/requirements/MAIL-LATEST.md — no secret actions, SMTP primary,
# phase gate before any live send.
epics:
  - id: e34
    slug: mail-core
    title: "Mail core — verification, reset, notices through one mailer"
    wsjf: 3.7
    bcp_total: 30
    delta: ADDED
    note: >
      (10 + 9 + 9) / (30 / 4) = 3.7. Biggest job in the cycle but
      the only one that keeps the no-secret-actions promise: every
      operator action that touches a user must reach that user,
      password reset must exist for a public node, and the phase
      gate keeps LogMailer the default until staging proves a live
      send. Three stories: mailer core + address verification,
      password reset, SMTP arm + moderation notices.
  - id: e35
    slug: mail-retention
    title: "Mail retention — monthly JSONL rollups, drain-ready"
    wsjf: 6.5
    bcp_total: 8
    delta: ADDED
    note: >
      (6 + 3 + 4) / (8 / 4) = 6.5. Score is higher than e34's but
      the order is a sequencing constraint, not a score error:
      e35's mail_log half records the sends e34 produces, and its
      moderation_log half gives the trail e29/e33 write an
      unbounded home. One story: timestamp-first monthly JSONL at
      single write points, rotation by write date; no drain code
      ships.
  - id: e36
    slug: live-mail-gate
    title: "Live-mail gate — delivery readout, clear retry, staging proof"
    wsjf: 5.75
    bcp_total: 16
    delta: ADDED
    note: >
      (9 + 7 + 7) / (16 / 4) = 5.75. Closes the phase gate the v0.7.0
      constraints open: a per-send outcome in the retention lines and
      an operator-facing readout so mail health is a fact on the
      screen, a clear retry when the send path fails on signup or
      resend (reset stays response-neutral), and the staging proof
      that lets a live relay be configured later. Three stories:
      delivery readout (8), signup/resend clear retry (6), staging
      proof (2).
  - id: e37
    slug: mail-html-text
    title: "Mail bodies — HTML + plain-text pair per mail"
    wsjf: 6.5
    bcp_total: 8
    delta: ADDED
    note: >
      (6 + 3 + 4) / (8 / 4) = 6.5. Turns MAIL-LATEST's Templates
      requirement into shipped shape: every mail renders one
      context into an HTML and a plain-text arm before the single
      Mailer::send write point, neutral wording and path-form links
      unchanged. One story: the pair end to end (verify, reset,
      moderation) across all mailer arms.
  - id: e38
    slug: product-home
    title: "Product home — logged-out landing becomes a self-hoster page"
    wsjf: 4.0
    bcp_total: 9
    delta: MODIFIED
    note: >
      (6 + 2 + 1) / (9 / 4) = 4.0. Replaces the logged-out `/`
      landing with a product page for self-hosters — the MVP
      audience VISION names — drafted from shipped facts and
      reviewed before build. Three stories: product page with the
      approved copy (5), auth surface = footer /login only, zero
      account CTAs (2), gate pass (ux_audit strict + 390 viewport
      + preflight) (2).
  - id: e39
    slug: kata-theme
    title: "kata theme — proxy-injected stylesheet from DESIGN.md tokens"
    wsjf: 4.0
    bcp_total: 7
    delta: MODIFIED
    note: >
      (4 + 2 + 1) / (7 / 4) = 4.0. Restyles the pinned kata
      sidecar bundle at the proxy seam: inventory the bundle's
      theming surface, inject a theme-stylesheet link into proxied
      HTML only, serve a DESIGN.md-derived kata-theme.css. No
      upstream PRs, no fork this cycle (user decision). Two
      stories: probe + injection + theme stylesheet (5), gate
      pass (2). Option 2 (header injection) and option 3 (iframe
      shell) are named escalations, decided after this lands.
  - id: e40
    slug: kata-chrome
    title: "kata in site chrome — forked layout slot + proxy-injected site nav"
    wsjf: 4.0
    bcp_total: 8
    delta: MODIFIED
    note: >
      (4 + 2 + 1) / (8 / 4) = 4.0. User decision 2026-11-09:
      fork martint/kata (Apache-2.0) and own the chrome layout;
      iframe rejected; scope = /r/* only. KATA_REPO was already an
      ARG, so s01 flips the source with the single-literal pin
      intact; s02 adds var(--jj-chrome-h, 0px) to the fork's
      outer-top offsets (default 0 = pixel-identical); s03
      extends the e39 injection seam to prepend the rendered site
      nav plus a dedicated kata-chrome.css; s04 gates.

bugs:
  total: 2
  fixed: 2
  deferred: 0
  wontfix: 0
  open: 0
  registry: specs/bugs/registry.yaml
