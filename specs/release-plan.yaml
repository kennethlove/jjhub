# specs/release-plan.yaml — WSJF-ordered epic index for jjhub

# v0.7.0 cycle. version is a non-authoritative mirror; semantic-release
# decides the real tag at merge (gh release view wins).
# v0.6.0 epics (e30-e33) shipped; their capsules remain in specs/epics/.

version: "0.7.0"
status: planning
workflow_mode: solo-git
bump_hint: minor

# WSJF = (business value + time criticality + risk reduction) / job
# size; job size in day-equivalents (4 BCP ~= 1 focused day), the
# same scale as the prior cycles' entries. No security boost applied
# (no THREAT_MODEL files exist for these epics). Requirements source:
# specs/requirements/MAIL-LATEST.md — no secret actions, SMTP primary,
# phase gate before any live send.
epics:
  - id: e34
    slug: mail-core
    title: "Mail core — verification, reset, notices through one mailer"
    wsjf: 3.7
    bcp_total: 30
    delta: ADDED
    note: >
      (10 + 9 + 9) / (30 / 4) = 3.7. Biggest job in the cycle but
      the only one that keeps the no-secret-actions promise: every
      operator action that touches a user must reach that user,
      password reset must exist for a public node, and the phase
      gate keeps LogMailer the default until staging proves a live
      send. Three stories: mailer core + address verification,
      password reset, SMTP arm + moderation notices.
  - id: e35
    slug: mail-retention
    title: "Mail retention — monthly JSONL rollups, drain-ready"
    wsjf: 6.5
    bcp_total: 8
    delta: ADDED
    note: >
      (6 + 3 + 4) / (8 / 4) = 6.5. Score is higher than e34's but
      the order is a sequencing constraint, not a score error:
      e35's mail_log half records the sends e34 produces, and its
      moderation_log half gives the trail e29/e33 write an
      unbounded home. One story: timestamp-first monthly JSONL at
      single write points, rotation by write date, optional
      JJHUB_LOG_DRAIN hook.

bugs:
  total: 2
  fixed: 2
  deferred: 0
  wontfix: 0
  open: 0
  registry: specs/bugs/registry.yaml
